services:
  postgres:
    image: postgres:16-alpine
    container_name: strava_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strava_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strava_password}
      POSTGRES_DB: ${POSTGRES_DB:-strava_gamification}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - strava_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strava_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: strava_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - strava_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strava_backend
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_USER: ${POSTGRES_USER:-strava_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strava_password}
      POSTGRES_DB: ${POSTGRES_DB:-strava_gamification}
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,https://51.159.67.199}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - strava_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strava_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - strava_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: strava_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - strava_network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: strava_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  strava_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
